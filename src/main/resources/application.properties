# ===============================
# DATABASE CONFIG - AIVEN CLOUD
# ===============================

spring.datasource.url=jdbc:mysql://mysql-26eded0d-centropsico.i.aivencloud.com:13965/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# ===============================
# ERROR CONFIG
# ===============================

server.error.whitelabel.enabled=false
server.error.path=/error

# ===============================
# EMAIL CONFIG - MAILPRO API
# ===============================

mailpro.api.base-url=https://api.mailpro.com/v2
mailpro.api.id-client=${MAILPRO_ID_CLIENT}
mailpro.api.key=${MAILPRO_API_KEY}
mailpro.api.sender-id=${MAILPRO_ID_EMAIL_EXP}

app.mail.from=${MAIL_FROM}