# ===============================
# DATABASE CONFIG - AIVEN CLOUD
# ===============================

spring.datasource.url=jdbc:mysql://mysql-26eded0d-centropsico.i.aivencloud.com:13965/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# ===============================
# ERROR CONFIG
# ===============================

server.error.whitelabel.enabled=false
server.error.path=/error

# ===============================
# EMAIL CONFIG - BREVO API
# ===============================

brevo.api.base-url=https://api.brevo.com/v3
brevo.api.key=${BREVO_API_KEY}

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:CentroPsico}

# ===============================
# SEGURIDAD
# ===============================

app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}

# ===============================
# JWT CONFIG
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ===============================
# URL PÚBLICA DEL SISTEMA
# ===============================

app.web.url=${APP_WEB_URL:https://centropsico-system.onrender.com}


# ===============================
# RECUPERACIÓN DE CONTRASEÑA
# ===============================

app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}